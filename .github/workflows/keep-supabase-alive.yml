name: Keep Supabase alive

# Evita que el proyecto Supabase (plan Free) se pause por inactividad.
# Supabase pausa tras ~7 dias sin actividad; esto hace una query trivial
# (SELECT 1) a la base de datos dos veces por semana, con margen de sobra.

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (hora UTC, no local).
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Postgres (SELECT 1)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secret SUPABASE_DB_URL"; exit 1
          fi
          if psql "$SUPABASE_DB_URL" -tAc "select 1;" >/dev/null 2>&1; then
            echo "Ping OK: $(date -u) UTC"
            exit 0
          fi

          if [[ "$SUPABASE_DB_URL" == *".pooler.supabase.com"* ]] && [[ "$SUPABASE_DB_URL" =~ ^postgres(ql)?://postgres\.[^:]+: ]]; then
            SUPABASE_DB_URL_NORMALIZED="$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^(postgres(ql)?://)postgres\.[^:]+:#\1postgres:#')"
            echo "Reintentando ping con usuario de pooler normalizado..."
            psql "$SUPABASE_DB_URL_NORMALIZED" -tAc "select 1;"
            echo "Ping OK: $(date -u) UTC"
            exit 0
          fi

          echo "No se pudo conectar a Supabase con SUPABASE_DB_URL."
          exit 1
