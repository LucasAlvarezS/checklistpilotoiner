name: Keep Supabase alive

# Evita que el proyecto Supabase (plan Free) se pause por inactividad.
# Supabase pausa tras ~7 dias sin actividad; esto hace una query trivial
# (SELECT 1) a la base de datos dos veces por semana, con margen de sobra.

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (hora UTC, no local).
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Postgres (SELECT 1)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secret SUPABASE_DB_URL"; exit 1
          fi
          psql "$SUPABASE_DB_URL" -tAc "select 1;"
          echo "Ping OK: $(date -u) UTC"
